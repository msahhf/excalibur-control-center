<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0b0d" />

    <!-- Static fallback for the English copy; the i18n layer keeps <html lang>,
         <title> and the description/OG/Twitter metadata in sync per locale. -->
    <title>EXCALIBUR Control Center — read-only telemetry for EXCALIBUR laptops</title>
    <meta
      name="description"
      content="A native Qt6, read-only telemetry app for CASPER EXCALIBUR laptops on Linux: CPU/GPU temperature, fan RPM, system information and an exportable diagnostics report. No root, no hardware control."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="canonical" href="https://excalibur-control-center.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EXCALIBUR Control Center" />
    <meta property="og:url" content="https://excalibur-control-center.vercel.app/" />
    <meta property="og:title" content="EXCALIBUR Control Center — read-only hardware telemetry" />
    <meta
      property="og:description"
      content="Read-only thermal and cooling telemetry for CASPER EXCALIBUR laptops on Linux."
    />
    <meta property="og:image" content="https://excalibur-control-center.vercel.app/images/dashboard-dark.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="EXCALIBUR Control Center dashboard showing CPU/GPU temperature and fan RPM" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EXCALIBUR Control Center — read-only hardware telemetry" />
    <meta
      name="twitter:description"
      content="Read-only thermal and cooling telemetry for CASPER EXCALIBUR laptops on Linux."
    />
    <meta name="twitter:image" content="https://excalibur-control-center.vercel.app/images/dashboard-dark.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 46rem; margin: 4rem auto; padding: 0 1.5rem; font: 16px/1.6 system-ui, sans-serif; color: #e7edf6">
        <h1 style="font-size: 2rem">EXCALIBUR Control Center</h1>
        <p>
          A native Qt6, read-only telemetry control center for CASPER EXCALIBUR laptops on Linux. It shows
          CPU/GPU temperature, fan RPM, system information and diagnostics.
        </p>
        <p>
          This showcase site needs JavaScript for its interactive presentation. The product, source code and
          downloads are available on
          <a style="color: #7ab8ff" href="https://github.com/msahhf/excalibur-control-center">GitHub</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
