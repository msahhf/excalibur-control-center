# DKMS configuration for the excalibur-wmi read-only hwmon driver.
#
# This dir is installed as /usr/src/<PACKAGE_NAME>-<PACKAGE_VERSION>/ . Arch's
# dkms pacman hooks derive the module id from that directory name, so
# PACKAGE_NAME/PACKAGE_VERSION must stay in sync with the directory (guard in the
# PKGBUILD) and with the application version.
#
# The kernel module is named excalibur_wmi (the built file is excalibur-wmi.ko);
# the DKMS PACKAGE_NAME is intentionally a different, descriptive name, exactly
# like virtualbox-host-dkms installs the "vboxhost" module. The module name is
# NOT forced to equal the package name.

PACKAGE_NAME="excalibur-wmi"
PACKAGE_VERSION="0.5.7"

BUILT_MODULE_NAME[0]="excalibur-wmi"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"

AUTOINSTALL="yes"
MAKE[0]="make KERNELRELEASE=${kernelver}"

# The driver uses the wmidev_set_block()/wmidev_query_block() kernel API, which
# exists in the 7.2.x kernel series and is absent in 6.18.x-lts (there the build
# fails with implicit-declaration errors). Declare that minimum so DKMS refuses
# the module on older kernels BEFORE attempting to compile it, instead of
# presenting a broken build. This is an honest lower bound:
#   * it does not claim any kernel is supported beyond what is actually built,
#   * it does not block newer kernels (7.3+, 8.x) that may still be compatible.
# DKMS returns exit code 77 ("skipped due to BUILD_EXCLUSIVE") with a clear
# message for excluded kernels; it is not compiled and not installed.
BUILD_EXCLUSIVE_KERNEL_MIN="7.2"

# No CLEAN directive: DKMS >= 3 ignores it (and warns "Deprecated feature: CLEAN").
# DKMS rebuilds in a fresh per-kernel build tree, so an explicit clean is not
# needed; the Makefile's `clean` target remains available for manual use.
