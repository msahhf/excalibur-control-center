# DKMS configuration for the excalibur-wmi read-only hwmon driver.
#
# This dir is installed as /usr/src/<PACKAGE_NAME>-<PACKAGE_VERSION>/ . Arch's
# dkms pacman hooks derive the module id from that directory name, so
# PACKAGE_NAME/PACKAGE_VERSION must stay in sync with the directory (guard in the
# PKGBUILD) and with the application version.
#
# The kernel module is named excalibur_wmi (the built file is excalibur-wmi.ko);
# the DKMS PACKAGE_NAME is intentionally a different, descriptive name, exactly
# like virtualbox-host-dkms installs the "vboxhost" module. The module name is
# NOT forced to equal the package name.

PACKAGE_NAME="excalibur-wmi"
PACKAGE_VERSION="0.5.2"

BUILT_MODULE_NAME[0]="excalibur-wmi"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"

AUTOINSTALL="yes"
MAKE[0]="make KERNELRELEASE=${kernelver}"
CLEAN="make KERNELRELEASE=${kernelver} clean"
