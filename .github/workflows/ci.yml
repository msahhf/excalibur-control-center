name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# Minimal permissions: the CI only reads the repository.
permissions:
  contents: read

jobs:
  # Lightweight, container-less gate that runs on every push/PR (no published
  # tag required). `git archive` honours the same .gitattributes export-ignore
  # rules that GitHub's tag auto-archive does, so it reproduces the published
  # source archive locally and lets us fail fast if:
  #   - a prebuilt kernel module (.ko) or the packaging/.github content leaks in;
  #   - the driver sources DKMS needs went missing;
  #   - the .gitattributes .ko export-ignore line was silently removed.
  source-archive-guard:
    name: Source archive guard (no prebuilt .ko)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source archive and audit its contents
        run: |
          set -euo pipefail
          # Same export-ignore semantics as GitHub's /archive/refs/tags/<tag>.tar.gz.
          git archive --format=tar --prefix="excalibur-control-center-archive-guard/" HEAD > /tmp/guard.tar
          # List to a file first: piping tar into grep under pipefail can SIGPIPE tar.
          tar -tf /tmp/guard.tar > /tmp/guard-list.txt
          echo "--- source archive listing ($(wc -l < /tmp/guard-list.txt) entries) ---"
          cat /tmp/guard-list.txt
          echo "--- end listing ---"

          # NEGATIVE: forbidden content must be absent.
          # NOTE: use (^|/)[^/]*\.ko$ — the tempting (^|/)\.ko$ only matches a
          # basename of literally ".ko" and would miss analysis/phase3/excalibur-wmi.ko.
          if grep -E '(^|/)[^/]*\.ko$' /tmp/guard-list.txt; then
            echo "::error::source archive contains a prebuilt kernel module (.ko); add an export-ignore rule"
            exit 1
          fi
          if grep -E '/packaging/arch/PKGBUILD$|/\.github/workflows/' /tmp/guard-list.txt; then
            echo "::error::source archive contains packaging/.github content (self-referential checksum)"
            exit 1
          fi

          # POSITIVE: the DKMS build inputs must be present.
          for f in driver/dkms.conf driver/Makefile analysis/phase3/excalibur-wmi.c; do
            grep -qF "excalibur-control-center-archive-guard/$f" /tmp/guard-list.txt \
              || { echo "::error::source archive is missing DKMS build input: $f"; exit 1; }
          done

          # EXPORT-IGNORE GUARD: the rule keeping the prebuilt .ko out must still
          # exist in .gitattributes (catches a silent removal of the line).
          grep -qF 'analysis/phase3/excalibur-wmi.ko export-ignore' .gitattributes \
            || { echo "::error::.gitattributes lost the 'analysis/phase3/excalibur-wmi.ko export-ignore' rule"; exit 1; }

          echo "source archive guard OK"

  # Qt 6.4 compatibility gate. The Arch job above builds against a very recent
  # Qt (6.11/6.12); the deb/AppImage builds (Ubuntu 24.04, Debian 12) ship an
  # older Qt 6.4 that only runs in release.yml, i.e. *after* a tag is cut. That
  # gap let the v0.5.7 release break on Qt 6.4 (`qt_add_translations ...
  # SOURCE_TARGETS` was added in Qt 6.7). This job reproduces the oldest
  # supported Qt on a plain ubuntu:24.04 container so the same regression class
  # is caught on every push/PR, before a release is tagged. It deliberately
  # builds only the GUI (configure + build), covering the qt_add_translations /
  # lupdate / lrelease path, .qm generation and the :/i18n embedding.
  qt64-build:
    name: Ubuntu 24.04 (Qt 6.4) GUI build
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Qt 6.4)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            ca-certificates

      - name: Show Qt version (must be 6.4.x)
        run: |
          qmake6 -query QT_VERSION
          QT_VER=$(qmake6 -query QT_VERSION)
          echo "Qt version: $QT_VER"
          case "$QT_VER" in
            6.4.*) echo "Qt 6.4 series confirmed" ;;
            *) echo "::error::expected Qt 6.4.x, got $QT_VER"; exit 1 ;;
          esac

      - name: GUI configure + build (compiler warnings gated)
        run: |
          cmake -S gui -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build 2>&1 | tee build.log
          # Only fail on *compiler* warnings: `warning:` (lowercase) matches the
          # gcc/clang diagnostic form ("file.cpp:12:5: warning: ...") but not
          # CMake's own "CMake Warning at ..." (capitalised), which is expected
          # noise on the older Qt 6.4 toolchain.
          if grep -q 'warning:' build.log; then
            echo "::error::compiler warnings found on Qt 6.4 (-Wall -Wextra must be clean)"
            exit 1
          fi

  arch:
    name: Arch build · package · DKMS · validation
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja gcc qt6-base qt6-tools dkms \
            desktop-file-utils appstream \
            git tar gzip zstd libarchive curl

      - uses: actions/checkout@v4

      - name: Mark the workspace as a safe git directory (root)
        run: |
          # This job runs as root in the container and later `chown -R
          # builder:builder .` hands the workspace to the unprivileged build
          # user. Every root `git` call after that (ls-remote/archive/diff/
          # checkout) would otherwise abort with "detected dubious ownership".
          # actions/checkout@v4 already does this via its default
          # set-safe-directory=true, but we state it explicitly here so the
          # guarantee does not silently depend on that default: it writes to
          # root's global git config and therefore covers all later root git
          # invocations in this job.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: "Derive version (single source: CMake)"
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/p' gui/CMakeLists.txt | head -n1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          [ -n "$VERSION" ] || { echo "::error::could not read CMake project VERSION"; exit 1; }
          echo "version: $VERSION"

      - name: GUI configure + build (warning-gated)
        run: |
          cmake -S gui -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo "::error::compiler warnings found (-Wall -Wextra must be clean)"
            exit 1
          fi

      - name: Runtime smoke (offscreen, driver absent)
        run: |
          # Capture stdout+stderr to a file so Qt fatal errors are visible, and
          # accept exit 0 (clean quit) or 124 (still running after the timeout, the
          # normal case for the interactive GUI). Any other exit code is a real
          # failure and must fail the job rather than being masked with `|| true`.
          set +e
          timeout 3 env QT_QPA_PLATFORM=offscreen ./build/excalibur-control-center > /tmp/smoke.log 2>&1
          rc=$?
          set -e
          echo "--- runtime smoke output (exit=$rc) ---"
          cat /tmp/smoke.log
          echo "--- end runtime smoke output ---"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "::error::runtime smoke failed (exit=$rc)"
            exit 1
          fi
          if grep -Eq 'qt\.qpa|Segmentation fault|Fatal error' /tmp/smoke.log; then
            echo "::error::runtime smoke reported a fatal Qt/runtime error"
            exit 1
          fi

      - name: Unit tests (temperature conversion + settings parsing)
        run: |
          cmake -S gui -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXCALIBUR_BUILD_TESTS=ON
          cmake --build build-tests 2>&1 | tee build-tests.log
          if grep -q 'warning:' build-tests.log; then
            echo "::error::compiler warnings found in unit-test build (must be clean)"
            exit 1
          fi
          ctest --test-dir build-tests --output-on-failure

      - name: Dev-only headless hooks (--once / --export-diagnostics / stress)
        run: |
          # The app ships dev-only CLI hooks behind -DEXCALIBUR_DEV_HOOKS=ON. Build
          # them into their own tree and exercise the read-only runtime paths
          # headlessly under the offscreen platform, so hook/hwmon regressions are
          # caught in CI instead of only by hand.
          cmake -S gui -B build-devhooks -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXCALIBUR_DEV_HOOKS=ON
          cmake --build build-devhooks

          BIN=./build-devhooks/excalibur-control-center

          # Deterministic synthetic hwmon device: the app discovers by name
          # (excalibur_g870) and reads tempN_input/fanN_input, so a hand-made tree
          # exercises the CONNECTED state with no hardware and no root.
          HWMONROOT=$(mktemp -d)
          mkdir -p "$HWMONROOT/hwmon0"
          printf 'excalibur_g870\n' > "$HWMONROOT/hwmon0/name"
          printf '52000\n' > "$HWMONROOT/hwmon0/temp1_input"
          printf '61000\n' > "$HWMONROOT/hwmon0/temp2_input"
          printf '1500\n' > "$HWMONROOT/hwmon0/fan1_input"
          printf '1800\n' > "$HWMONROOT/hwmon0/fan2_input"

          # Keep settings writes out of the real HOME and give Qt a runtime dir.
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$(mktemp -d)"

          # Every hook must exit 0; a non-zero hook fails the step.
          run_hook() { # label args...
            local label="$1"; shift
            echo "=== hook: $label ==="
            if ! QT_QPA_PLATFORM=offscreen EXCALIBUR_HWMON_ROOT="$HWMONROOT" \
                 timeout 60 "$BIN" "$@"; then
              echo "::error::dev hook '$label' failed"
              exit 1
            fi
          }

          run_hook "--once (connected fixture)" --once

          run_hook "--export-diagnostics" --export-diagnostics /tmp/devhooks-diagnostics.json
          test -s /tmp/devhooks-diagnostics.json \
            || { echo "::error::diagnostics export missing/empty"; exit 1; }
          echo "diagnostics export: $(wc -c < /tmp/devhooks-diagnostics.json) bytes"

          # Singleton guard: repeated hide/show + navigation must not create
          # duplicate telemetry owners.
          echo "=== hook: --tray-stress --cycles 3 ==="
          QT_QPA_PLATFORM=offscreen EXCALIBUR_HWMON_ROOT="$HWMONROOT" \
            timeout 60 "$BIN" --tray-stress --cycles 3 2>&1 | tee /tmp/tray-stress.log
          grep -q 'models=1' /tmp/tray-stress.log \
            || { echo "::error::tray-stress reported duplicate telemetry owners"; exit 1; }

          run_hook "--stress --seconds 2" --stress --seconds 2
          run_hook "--exercise-runtime" --exercise-runtime

          # Settings persistence hooks: mutate then round-trip via --dump-settings.
          run_hook "--reset-settings --set-*" \
            --reset-settings --set-theme dark --set-unit fahrenheit --set-refresh 2000
          SETTINGS_OUT=$(QT_QPA_PLATFORM=offscreen "$BIN" --dump-settings)
          echo "$SETTINGS_OUT"
          echo "$SETTINGS_OUT" | grep -q 'unit=fahrenheit' \
            || { echo "::error::settings persistence hook did not round-trip"; exit 1; }

      - name: makepkg from the public release source (non-root)
        run: |
          set -euo pipefail
          # The PKGBUILD's canonical source is this version's GitHub release
          # archive, so the committed build is tag-dependent: on a *pre-tag*
          # preparation branch the tag does not exist yet (404) and the
          # committed sha256sums is the placeholder 'TO_BE_SET_AFTER_TAG'
          # (release.yml rewrites it with updpkgsums once the tag is pushed).
          # Two modes keep the build verifiable in both cases without ever
          # skipping or faking a checksum:
          #
          #   * tag published -> unchanged historical behaviour: makepkg fetches
          #     the real release archive and verifies the committed real sha256;
          #   * tag absent    -> reproduce the tag archive locally with
          #     `git archive` (identical .gitattributes export-ignore semantics
          #     and the same excalibur-control-center-$VERSION/ root as GitHub's
          #     /archive/refs/tags/<tag>.tar.gz), record its REAL sha256, and
          #     build against that local file. makepkg still verifies a genuine
          #     hash of a genuine archive — no fake or skipped checksum.
          useradd -m builder
          chown -R builder:builder .

          # Write the tag query to a variable before grepping: piping the remote
          # listing into `grep -q` under `pipefail` can SIGPIPE git and fail.
          TAGS=$(git ls-remote --tags origin "refs/tags/v$VERSION")
          if printf '%s\n' "$TAGS" | grep -q "refs/tags/v$VERSION"; then
            echo "tag v$VERSION is published: building from the released source archive"
            su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -C -c -f --noconfirm"
          else
            echo "tag v$VERSION is not published yet: building from a local git-archive source"
            SRCDEST=/tmp/excalibur-srcdest
            rm -rf "$SRCDEST"
            mkdir -p "$SRCDEST"
            # Same export-ignore semantics as GitHub's tag auto-archive.
            git archive --format=tar.gz \
              --prefix="excalibur-control-center-$VERSION/" \
              -o "$SRCDEST/v$VERSION.tar.gz" HEAD
            LOCAL_SHA=$(sha256sum "$SRCDEST/v$VERSION.tar.gz" | cut -d' ' -f1)
            echo "local source archive sha256: $LOCAL_SHA"

            # Patch a throwaway copy of the recipe only: point source at the
            # local archive and set sha256sums to its real hash. The committed
            # PKGBUILD is not left modified (a restore step puts it back before
            # the .SRCINFO check below).
            cp packaging/arch/PKGBUILD "$SRCDEST/PKGBUILD"
            sed -i "s|^source=.*|source=(\"file://$SRCDEST/v$VERSION.tar.gz\")|" "$SRCDEST/PKGBUILD"
            sed -i "s|^sha256sums=.*|sha256sums=('$LOCAL_SHA')|" "$SRCDEST/PKGBUILD"

            # The (unchanged) Qt ABI step builds a second package with `makepkg`
            # in packaging/arch, so the local-source recipe must be in place
            # there too for the pre-tag run.
            install -m644 "$SRCDEST/PKGBUILD" packaging/arch/PKGBUILD
            chown -R builder:builder "$SRCDEST" packaging/arch
            su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -C -c -f --noconfirm"
          fi

      - name: Package content audit
        run: |
          PKG=$(ls packaging/arch/excalibur-control-center-[0-9]*.pkg.tar.zst)
          echo "Package: $PKG"
          echo "VERSION=$VERSION"
          # List with GNU tar (Arch container); fall back to bsdtar. Save the
          # listing first: piping tar into `grep -q` under `pipefail` makes grep
          # close the pipe early and SIGPIPE tar, failing the step.
          if ! tar --zstd -tf "$PKG" > /tmp/pkglist.raw 2>/dev/null; then
            bsdtar -tf "$PKG" > /tmp/pkglist.raw
          fi
          sort /tmp/pkglist.raw > /tmp/pkglist.txt
          echo "--- package listing ($(wc -l < /tmp/pkglist.txt) entries) ---"
          cat /tmp/pkglist.txt
          echo "--- end listing ---"
          # (^|/)[^/]*\.ko$ and not (^|/)\.ko$: the latter only matches an entry
          # whose final component is exactly ".ko", so it would miss a real
          # prebuilt module like usr/lib/modules/<ver>/excalibur-wmi.ko.
          if grep -E '(^|/)[^/]*\.ko$|/home/|\.config|\.INSTALL|secret' /tmp/pkglist.txt; then
            echo "::error::forbidden content in package"; exit 1
          fi
          grep -q 'usr/bin/excalibur-control-center' /tmp/pkglist.txt \
            || { echo "::error::missing usr/bin/excalibur-control-center"; exit 1; }
          grep -q "usr/src/excalibur-wmi-$VERSION/dkms.conf" /tmp/pkglist.txt \
            || { echo "::error::missing usr/src/excalibur-wmi-$VERSION/dkms.conf"; exit 1; }
          grep -q 'usr/share/licenses/excalibur-control-center/LICENSE' /tmp/pkglist.txt \
            || { echo "::error::missing installed LICENSE"; exit 1; }

      - name: Qt ABI packaging verification (non-publishing)
        run: |
          # Verify BOTH packaging paths without publishing a release:
          #  - default (source/AUR): plain `qt6-base` runtime dependency;
          #  - release-mode (EXCALIBUR_RELEASE_QT_MIN set): a versioned dependency
          #    whose minimum is >= the binary's real Qt symbol requirement.
          # Declaring a HIGHER minimum is safe (more restrictive); a LOWER one is
          # a false ABI claim and must fail. No install, no DKMS, no root work.
          QT_MIN="$(qmake6 -query QT_VERSION | cut -d. -f1,2)"
          echo "build Qt: $QT_MIN"

          # 1) Default package: unversioned Qt dependency only.
          PKG_DEF="$(ls packaging/arch/excalibur-control-center-[0-9]*.pkg.tar.zst)"
          tar --zstd -xOf "$PKG_DEF" .PKGINFO > /tmp/pkginfo.default 2>/dev/null \
            || bsdtar -xOf "$PKG_DEF" .PKGINFO > /tmp/pkginfo.default
          grep -qx 'depend = qt6-base' /tmp/pkginfo.default \
            || { echo "::error::default package must depend on plain qt6-base"; exit 1; }
          if grep -q '^depend = qt6-base>=' /tmp/pkginfo.default; then
            echo "::error::default package must not carry a versioned qt6-base dependency"; exit 1
          fi

          # 2) Release-mode package: versioned, ABI-accurate dependency.
          mkdir -p pkg-release && chown builder:builder pkg-release
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && PKGDEST='$GITHUB_WORKSPACE/pkg-release' EXCALIBUR_RELEASE_QT_MIN='$QT_MIN' makepkg -C -c -f --noconfirm"
          PKG_REL="$(ls pkg-release/excalibur-control-center-[0-9]*.pkg.tar.zst)"
          # Write .PKGINFO to a file (avoid piping tar into an early-exiting
          # reader, which can SIGPIPE tar under pipefail).
          tar --zstd -xOf "$PKG_REL" .PKGINFO > /tmp/pkginfo.release 2>/dev/null \
            || bsdtar -xOf "$PKG_REL" .PKGINFO > /tmp/pkginfo.release
          grep -qx "depend = qt6-base>=$QT_MIN" /tmp/pkginfo.release \
            || { echo "::error::release package must declare qt6-base>=$QT_MIN"; exit 1; }

          # 3) Metadata vs binary ABI: declared >= required must hold.
          TMP="$(mktemp -d)"
          tar --zstd -xf "$PKG_REL" -C "$TMP" usr/bin/excalibur-control-center 2>/dev/null \
            || bsdtar -xf "$PKG_REL" -C "$TMP" usr/bin/excalibur-control-center
          bash packaging/arch/verify-qt-abi.sh "$TMP/usr/bin/excalibur-control-center" "$QT_MIN"

          # 4) Automated negative/positive checks of the verifier itself.
          if bash packaging/arch/verify-qt-abi.sh "$TMP/usr/bin/excalibur-control-center" 1.0; then
            echo "::error::verifier must reject a declared minimum lower than required"; exit 1
          fi
          echo "negative test OK: lower-than-required declaration rejected"
          bash packaging/arch/verify-qt-abi.sh "$TMP/usr/bin/excalibur-control-center" 99.0
          echo "positive test OK: higher-than-required declaration accepted"

      - name: Restore the committed PKGBUILD after the pre-tag local build
        run: |
          # On a pre-tag run the makepkg step builds from a throwaway recipe
          # (local archive + its real sha256) placed in packaging/arch so the
          # unchanged Qt ABI step above could reuse it. Put the committed
          # PKGBUILD back so the checksum-drift and .SRCINFO-vs-PKGBUILD checks
          # below keep running against the real recipe. No-op on a tagged run.
          if ! git diff --quiet -- packaging/arch/PKGBUILD; then
            git checkout -- packaging/arch/PKGBUILD
            echo "restored committed packaging/arch/PKGBUILD"
          else
            echo "packaging/arch/PKGBUILD already pristine (tagged run)"
          fi

      - name: Source archive checksum drift check
        run: |
          # Guard against the self-referential-checksum bug class: once the tag
          # for this version is published, the PKGBUILD's sha256sums must match
          # the actual tag archive (which must not contain the packaging recipe),
          # and the archive must not carry the prebuilt kernel module.
          VERSION=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/p' gui/CMakeLists.txt | head -n1)
          if ! git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "refs/tags/v$VERSION"; then
            echo "tag v$VERSION is not published yet; skipping source checksum drift check"
            exit 0
          fi
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/v$VERSION.tar.gz"
          curl -fsSL -o "/tmp/v$VERSION.tar.gz" "$URL"
          tar -tzf "/tmp/v$VERSION.tar.gz" > /tmp/archive-list.txt
          if grep -qE '/packaging/arch/PKGBUILD$|/\.github/workflows/|(^|/)[^/]*\.ko$' /tmp/archive-list.txt; then
            echo "::error::tag archive contains packaging/arch/PKGBUILD, .github content or a prebuilt .ko"
            exit 1
          fi
          EXPECTED=$(sed -n "s/^sha256sums=('\([0-9a-f]*\)').*/\1/p" packaging/arch/PKGBUILD | head -1)
          ACTUAL=$(sha256sum "/tmp/v$VERSION.tar.gz" | cut -d' ' -f1)
          echo "PKGBUILD sha256sums: $EXPECTED"
          echo "tag archive sha256 : $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] \
            || { echo "::error::PKGBUILD sha256sums does not match the published tag archive"; exit 1; }

      - name: Validate .SRCINFO matches PKGBUILD
        run: |
          # makepkg refuses to run as root: generate as the build user.
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --printsrcinfo" > /tmp/.SRCINFO.generated
          cd packaging/arch
          # Order-insensitive comparison: makepkg versions may emit option/source
          # lines in a different order while the content is identical.
          if ! diff -u <(sort .SRCINFO) <(sort /tmp/.SRCINFO.generated) > /tmp/srcdiff.txt; then
            echo "::error::.SRCINFO content differs from generated"
            echo "::error::$(tr '\n' '|' < /tmp/srcdiff.txt | head -c 1500)"
            exit 1
          fi

      - name: desktop + AppStream validation
        run: |
          PKG=$(ls packaging/arch/excalibur-control-center-[0-9]*.pkg.tar.zst)
          mkdir -p /tmp/pkg
          tar --zstd -xf "$PKG" -C /tmp/pkg 2>/dev/null || bsdtar -xf "$PKG" -C /tmp/pkg
          desktop-file-validate /tmp/pkg/usr/share/applications/excalibur-control-center.desktop
          # AppStream: no errors required; warnings (no upstream domain/homepage) tolerated.
          appstreamcli validate --no-net /tmp/pkg/usr/share/metainfo/excalibur-control-center.metainfo.xml || true

      - name: DKMS source build (honest skip when the kernel API is absent)
        run: |
          pacman -S --noconfirm --needed linux linux-headers || true
          KVER=$(ls /usr/lib/modules 2>/dev/null | head -1 || true)
          if [ -z "$KVER" ] || [ ! -d "/usr/lib/modules/$KVER/build" ]; then
            echo "No kernel headers in this environment; skipping DKMS build"; exit 0
          fi
          if ! grep -rqs 'wmidev_set_block' "/usr/lib/modules/$KVER/build/include" 2>/dev/null; then
            echo "SKIP: installed kernel ($KVER) lacks the wmidev_* API (driver requires 7.2.x)"
            exit 0
          fi
          # Build via the SHIPPED driver/Makefile, exactly like DKMS does: it
          # derives the kernel build dir from KERNELRELEASE and auto-detects the
          # target toolchain (LLVM=1 for clang-built kernels). A raw kbuild
          # invocation bypasses that and fails on clang kernels; when the API is
          # present a real compile failure here must fail the job (no `|| true`).
          DKMSSRC=$(mktemp -d)
          cp driver/Makefile driver/dkms.conf analysis/phase3/excalibur-wmi.c "$DKMSSRC/"
          make -C "$DKMSSRC" KERNELRELEASE="$KVER"
          modinfo "$DKMSSRC/excalibur-wmi.ko" | grep -E '^(name|vermagic)'

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: excalibur-control-center-arch-package
          path: packaging/arch/excalibur-control-center-[0-9]*.pkg.tar.zst
          if-no-files-found: error
