name: Release

# Tag-driven release preparation. Builds the Arch package from the public release
# source and produces a SHA256SUMS file covering the package and the source
# archive. It does NOT publish a GitHub Release automatically (read-only
# permissions); the maintainer creates the Release from the artifacts, or enables
# the commented draft-release step.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: v* package + checksums
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja gcc qt6-base dkms desktop-file-utils appstream \
            git tar gzip zstd libarchive curl

      - uses: actions/checkout@v4

      - name: "Derive version and check tag (single source: CMake)"
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/p' gui/CMakeLists.txt | head -n1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ -n "${GITHUB_REF_NAME:-}" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag ($GITHUB_REF_NAME) does not match CMake VERSION (v$VERSION)"
            exit 1
          fi
          echo "version: $VERSION"

      - name: makepkg from the public release source (non-root)
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -C -c -f --noconfirm"

      - name: Checksums (package + source archive)
        run: |
          ARCH_URL="https://github.com/${{ github.repository }}/archive/refs/tags/v$VERSION.tar.gz"
          curl -fsSL -o "excalibur-control-center-$VERSION.tar.gz" "$ARCH_URL"
          cd packaging/arch
          {
            echo "# EXCALIBUR Control Center v$VERSION release checksums"
            sha256sum "../../excalibur-control-center-$VERSION.tar.gz" \
                      excalibur-control-center-[0-9]*.pkg.tar.zst
          } > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: excalibur-control-center-v${{ env.VERSION }}
          path: |
            packaging/arch/excalibur-control-center-[0-9]*.pkg.tar.zst
            excalibur-control-center-*.tar.gz
            packaging/arch/SHA256SUMS
          if-no-files-found: error

      # To publish a GitHub Release automatically, add a step using
      # `softprops/action-gh-release@v2` and grant `permissions: contents: write`.
      # Left to the maintainer to keep the workflow least-privileged.
