name: Release

# Tag-driven release. Builds the Arch package from the public release source,
# builds+tests the GUI-only AppImage (Debian 12), builds+tests the Debian 13 and
# Ubuntu 24.04 .deb packages, computes SHA256SUMS (package + source archive +
# AppImage + both .deb sets), uploads build artifacts, and publishes a GitHub
# Release for the tag with everything attached.
#
# The release job needs every required build/test job, so a failed package can
# never produce a release with missing or stale artifacts.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # required to create the GitHub Release for the tag

jobs:
  # Builds and tests the GUI-only AppImage in a pinned Debian 12 environment and
  # uploads it as an artifact. The release job depends on this, so a failed
  # AppImage build/test blocks the release (no stale AppImage is ever shipped).
  appimage:
    name: AppImage (Debian 12) build + test
    runs-on: ubuntu-latest
    container:
      image: debian:12
    steps:
      - name: Install git (container prerequisite for actions/checkout)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: "Derive version (single source: CMake)"
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/p' gui/CMakeLists.txt | head -n1)
          [ -n "$VERSION" ] || { echo "::error::could not read CMake VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version: $VERSION"

      - name: Build AppImage (reuses packaging/appimage/build-appimage-container.sh)
        run: |
          export REPO="$GITHUB_WORKSPACE" OUT="$GITHUB_WORKSPACE/appimage-dist"
          mkdir -p "$OUT"
          bash packaging/appimage/build-appimage-container.sh

      - name: Test AppImage (offscreen + xcb gate; Wayland best-effort)
        run: |
          bash packaging/appimage/test-appimage.sh "$GITHUB_WORKSPACE/appimage-dist/"*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: excalibur-control-center-appimage
          path: appimage-dist/*.AppImage
          if-no-files-found: error

  # Debian 13 (.deb): built from the repository sources in the distribution's own
  # environment so the declared Qt ABI matches that distribution, then installed,
  # launched and removed inside the same isolated container.
  debian:
    name: Debian 13 .deb build + test
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git ca-certificates build-essential dpkg-dev debhelper fakeroot \
            cmake ninja-build qt6-base-dev qt6-tools-dev qt6-l10n-tools

      - uses: actions/checkout@v4

      - name: "Derive version (single source: CMake)"
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/p' gui/CMakeLists.txt | head -n1)
          [ -n "$VERSION" ] || { echo "::error::could not read CMake VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version: $VERSION"

      - name: Build .deb (distro-specific revision; deterministic filenames)
        run: |
          export OUT="$GITHUB_WORKSPACE/packaging/debian/dist"
          export DEB_VERSION="$VERSION-1~deb13"
          bash packaging/debian/build-deb.sh

      - name: Verify .deb metadata + install/launch/remove (isolated container)
        run: |
          set -e
          GUI_DEB=$(ls packaging/debian/dist/excalibur-control-center_"$VERSION"-1~deb13_*.deb)
          DKMS_DEB=$(ls packaging/debian/dist/excalibur-control-center-dkms_"$VERSION"-1~deb13_*.deb)
          dpkg-deb -f "$GUI_DEB" Package Version Architecture Depends Recommends
          # No stale hard-coded DKMS version and no missing dependency:
          dpkg-deb -f "$DKMS_DEB" Depends | grep -q 'dkms' || { echo "::error::dkms package must depend on dkms"; exit 1; }
          if dpkg-deb -e "$DKMS_DEB" /tmp/ctl && grep -rq 'dkms add -m excalibur-wmi -v 0\.5' /tmp/ctl; then
            echo "::error::DKMS hook hard-codes a version (must derive it)"; exit 1
          fi
          dpkg-deb -c "$DKMS_DEB" | grep -q "usr/src/excalibur-wmi-$VERSION/dkms.conf" \
            || { echo "::error::missing /usr/src/excalibur-wmi-$VERSION/dkms.conf"; exit 1; }
          dpkg-deb -c "$GUI_DEB" | grep -q 'usr/share/applications/excalibur-control-center.desktop' \
            || { echo "::error::missing desktop entry"; exit 1; }
          # Real install (dependency closure from the distro repos) + launch + remove.
          apt-get install -y -qq --no-install-recommends ./packaging/debian/dist/*.deb
          dpkg -l | grep -q excalibur-control-center
          export QT_QPA_PLATFORM=offscreen XDG_RUNTIME_DIR=/tmp/rt; mkdir -p /tmp/rt; chmod 700 /tmp/rt
          rc=0; timeout 5 excalibur-control-center >/tmp/gui.log 2>&1 || rc=$?
          if [ "$rc" != 124 ] && [ "$rc" != 0 ]; then echo "::error::GUI failed to start (rc=$rc)"; tail -5 /tmp/gui.log; exit 1; fi
          apt-get purge -y -qq excalibur-control-center excalibur-control-center-dkms
          test ! -e /usr/bin/excalibur-control-center || { echo "::error::binary left after purge"; exit 1; }
          echo "debian .deb lifecycle OK"

      - name: Upload Debian 13 .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: excalibur-control-center-deb-debian13
          path: packaging/debian/dist/*.deb
          if-no-files-found: error

  # Ubuntu 24.04 (.deb): built in the Ubuntu 24.04 environment. The Qt ABI is
  # different from Debian 13 (Qt 6.4 vs 6.8), so this is a separate build — the
  # Debian package is NOT reused under a different name.
  ubuntu:
    name: Ubuntu 24.04 .deb build + test
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git ca-certificates build-essential dpkg-dev debhelper fakeroot \
            cmake ninja-build qt6-base-dev qt6-tools-dev qt6-l10n-tools

      - uses: actions/checkout@v4

      - name: "Derive version (single source: CMake)"
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/p' gui/CMakeLists.txt | head -n1)
          [ -n "$VERSION" ] || { echo "::error::could not read CMake VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version: $VERSION"

      - name: Build .deb (distro-specific revision; deterministic filenames)
        run: |
          export OUT="$GITHUB_WORKSPACE/packaging/debian/dist"
          export DEB_VERSION="$VERSION-1~ubuntu24.04"
          bash packaging/debian/build-deb.sh

      - name: Verify .deb metadata + install/launch/remove (isolated container)
        run: |
          set -e
          GUI_DEB=$(ls packaging/debian/dist/excalibur-control-center_"$VERSION"-1~ubuntu24.04_*.deb)
          DKMS_DEB=$(ls packaging/debian/dist/excalibur-control-center-dkms_"$VERSION"-1~ubuntu24.04_*.deb)
          dpkg-deb -f "$GUI_DEB" Package Version Architecture Depends Recommends
          dpkg-deb -f "$DKMS_DEB" Depends | grep -q 'dkms' || { echo "::error::dkms package must depend on dkms"; exit 1; }
          dpkg-deb -c "$DKMS_DEB" | grep -q "usr/src/excalibur-wmi-$VERSION/dkms.conf" \
            || { echo "::error::missing /usr/src/excalibur-wmi-$VERSION/dkms.conf"; exit 1; }
          apt-get install -y -qq --no-install-recommends ./packaging/debian/dist/*.deb
          dpkg -l | grep -q excalibur-control-center
          export QT_QPA_PLATFORM=offscreen XDG_RUNTIME_DIR=/tmp/rt; mkdir -p /tmp/rt; chmod 700 /tmp/rt
          rc=0; timeout 5 excalibur-control-center >/tmp/gui.log 2>&1 || rc=$?
          if [ "$rc" != 124 ] && [ "$rc" != 0 ]; then echo "::error::GUI failed to start (rc=$rc)"; tail -5 /tmp/gui.log; exit 1; fi
          apt-get purge -y -qq excalibur-control-center excalibur-control-center-dkms
          test ! -e /usr/bin/excalibur-control-center || { echo "::error::binary left after purge"; exit 1; }
          echo "ubuntu .deb lifecycle OK"

      - name: Upload Ubuntu 24.04 .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: excalibur-control-center-deb-ubuntu2404
          path: packaging/debian/dist/*.deb
          if-no-files-found: error

  release:
    name: v* package + release
    needs: [ appimage, debian, ubuntu ]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja gcc qt6-base qt6-tools dkms desktop-file-utils appstream \
            pacman-contrib git tar gzip zstd libarchive curl

      - uses: actions/checkout@v4

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: excalibur-control-center-appimage
          path: appimage-dist

      - name: Download Debian 13 .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: excalibur-control-center-deb-debian13
          path: deb-debian13

      - name: Download Ubuntu 24.04 .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: excalibur-control-center-deb-ubuntu2404
          path: deb-ubuntu2404

      - name: Normalise .deb asset names (GitHub rewrites "~" on upload)
        run: |
          # GitHub replaces "~" in release asset names, which would make the
          # SHA256SUMS filenames disagree with the uploaded assets. Apply the
          # same normalisation here so the checksums, the uploaded assets and the
          # release notes refer to identical names.
          shopt -s nullglob
          for d in deb-debian13 deb-ubuntu2404; do
            for f in "$d"/*.deb; do
              nf="${f//\~/.}"
              [ "$f" = "$nf" ] || mv "$f" "$nf"
            done
          done
          ls -l deb-debian13 deb-ubuntu2404

      - name: "Derive version and check tag (single source: CMake)"
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/p' gui/CMakeLists.txt | head -n1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ -n "${GITHUB_REF_NAME:-}" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag ($GITHUB_REF_NAME) does not match CMake VERSION (v$VERSION)"
            exit 1
          fi
          echo "version: $VERSION"

      - name: "Resolve the minimum Qt ABI of the release binary"
        run: |
          # Qt symbol-versioning baseline: the binary built here requires this Qt
          # major.minor (verified below against the ELF). Derived from the build
          # environment, not hard-coded, so the package metadata stays honest as
          # Arch rolls Qt forward.
          QT_MIN="$(qmake6 -query QT_VERSION 2>/dev/null \
                    || pkg-config --modversion Qt6Core 2>/dev/null || true)"
          QT_MIN="$(printf '%s' "$QT_MIN" | cut -d. -f1,2)"
          if [[ ! "$QT_MIN" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not determine the build Qt version"; exit 1
          fi
          echo "QT_MIN=$QT_MIN" >> "$GITHUB_ENV"
          echo "build Qt: $QT_MIN"

      - name: makepkg from the public release source (non-root)
        run: |
          useradd -m builder
          chown -R builder:builder .
          # The PKGBUILD source is this tag's own archive, so its SHA256 cannot
          # be known before the tag exists (self-referential). Refresh the source
          # checksum from the actual published archive so the release is always
          # self-consistent, then build. EXCALIBUR_RELEASE_QT_MIN makes the
          # published package declare the exact Qt ABI the binary was linked
          # against (source/AUR builds stay unconstrained).
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && updpkgsums && EXCALIBUR_RELEASE_QT_MIN='$QT_MIN' makepkg -C -c -f --noconfirm"

      - name: "Verify package Qt dependency satisfies the binary ABI"
        run: |
          PKG="$(ls packaging/arch/excalibur-control-center-[0-9]*.pkg.tar.zst)"
          TMP="$(mktemp -d)"
          tar --zstd -xf "$PKG" -C "$TMP" usr/bin/excalibur-control-center 2>/dev/null \
            || bsdtar -xf "$PKG" -C "$TMP" usr/bin/excalibur-control-center
          # Write .PKGINFO to a file (avoid piping tar into an early-exiting
          # reader, which can SIGPIPE tar under pipefail).
          tar --zstd -xOf "$PKG" .PKGINFO > "$TMP/PKGINFO" 2>/dev/null \
            || bsdtar -xOf "$PKG" .PKGINFO > "$TMP/PKGINFO"
          DECLARED="$(awk -F'qt6-base>=' '/^depend = qt6-base>=/{print $2; exit}' "$TMP/PKGINFO")"
          # Declared minimum must be >= the binary's real Qt requirement; a higher
          # declaration is safe (more restrictive), a lower one is a false ABI
          # claim and must fail the workflow.
          bash packaging/arch/verify-qt-abi.sh \
            "$TMP/usr/bin/excalibur-control-center" "${DECLARED:-0}"

      - name: Guard against stale/renamed artifacts
        run: |
          # Every release binary must carry this version in its filename, so an
          # old artifact can never be uploaded as the new release.
          set -e
          ls appimage-dist/*.AppImage >/dev/null
          ls deb-debian13/*"$VERSION"*.deb >/dev/null || { echo "::error::no Debian .deb for v$VERSION"; exit 1; }
          ls deb-ubuntu2404/*"$VERSION"*.deb >/dev/null || { echo "::error::no Ubuntu .deb for v$VERSION"; exit 1; }

      - name: Checksums (package + source archive + debs + AppImage)
        run: |
          ARCH_URL="https://github.com/${{ github.repository }}/archive/refs/tags/v$VERSION.tar.gz"
          curl -fsSL -o "excalibur-control-center-$VERSION.tar.gz" "$ARCH_URL"
          # The source archive MUST NOT contain the packaging recipe: otherwise the
          # PKGBUILD checksum would be self-referential (the archive would contain
          # the file that stores its own hash). .gitattributes export-ignore keeps
          # packaging/ and .github/ out. Write the listing to a file first to avoid
          # SIGPIPE-ing tar under pipefail.
          tar -tzf "excalibur-control-center-$VERSION.tar.gz" > /tmp/archive-list.txt
          if grep -qE '/packaging/arch/PKGBUILD$|/\.github/workflows/' /tmp/archive-list.txt; then
            echo "::error::source archive contains packaging/.github content (self-referential checksum)"
            exit 1
          fi
          {
            echo "# EXCALIBUR Control Center v$VERSION release checksums"
            ( cd "$GITHUB_WORKSPACE" && sha256sum "excalibur-control-center-$VERSION.tar.gz" )
            ( cd packaging/arch && sha256sum excalibur-control-center-[0-9]*.pkg.tar.zst )
            ( cd "$GITHUB_WORKSPACE/appimage-dist" && sha256sum ./*.AppImage )
            ( cd "$GITHUB_WORKSPACE/deb-debian13" && sha256sum ./*.deb )
            ( cd "$GITHUB_WORKSPACE/deb-ubuntu2404" && sha256sum ./*.deb )
          } > packaging/arch/SHA256SUMS
          cat packaging/arch/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: excalibur-control-center-v${{ env.VERSION }}
          path: |
            packaging/arch/excalibur-control-center-[0-9]*.pkg.tar.zst
            excalibur-control-center-*.tar.gz
            appimage-dist/*.AppImage
            deb-debian13/*.deb
            deb-ubuntu2404/*.deb
            packaging/arch/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EXCALIBUR Control Center v${{ env.VERSION }}
          body_path: .github/release-notes/v${{ env.VERSION }}.md
          files: |
            packaging/arch/excalibur-control-center-[0-9]*.pkg.tar.zst
            excalibur-control-center-*.tar.gz
            appimage-dist/*.AppImage
            deb-debian13/*.deb
            deb-ubuntu2404/*.deb
            packaging/arch/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
